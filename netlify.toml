[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # These env vars are addresses and a domain, not secrets. The school domain has to be
  # in the site code, and Netlify's scanner flags any env var value it finds in the repo.
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER,SCHOOL_DOMAIN,COPY_TO,FROM_EMAIL"

[functions]
  node_bundler = "esbuild"

# The site publishes from the repo root, so block the server-side folder as a static path.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
